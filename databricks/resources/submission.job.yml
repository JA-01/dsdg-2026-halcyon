resources:
  jobs:
    submission:
      name: halcyon-phase2-bundle-submission
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tasks:
        - task_key: submission
          environment_key: halcyon
          timeout_seconds: 1800
          max_retries: 0
          notebook_task:
            notebook_path: ../pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              input_path: ${var.input_path}
              source_revision: ${var.source_revision}
      environments:
        - environment_key: halcyon
          spec:
            environment_version: "3"
            dependencies:
              - mlflow==3.18.0
              - pandas==3.1.1
              - scikit-learn==1.9.1
              - scipy==1.18.1
