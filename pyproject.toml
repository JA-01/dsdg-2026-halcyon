[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "halcyon"
version = "0.1.0"
description = "Halcyon supply-chain forecasting, ordering and submission pipeline"
requires-python = ">=3.11"
# Pins match tools/databricks/requirements.txt and the serverless setup job.
# Propose additions to the integration owner on the board before adding them.
dependencies = [
  "databricks-sdk==0.162.0",
  "mlflow==3.18.0",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["halcyon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
